name: Weekly firmware build

on:
  schedule:
    # Every Monday at 13:00 in Costa Rica (UTC-6).
    - cron: "0 19 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-firmware
  cancel-in-progress: false

env:
  # Checksums of the prepared base images are repository secrets (see
  # docs/inputs.md); nothing about them is committed here.
  STAGING_IMAGE_SHA256: ${{ secrets.STAGING_IMAGE_SHA256 }}
  R3PROII_STAGING_IMAGE_SHA256: ${{ secrets.R3PROII_STAGING_IMAGE_SHA256 }}
  R3II_2025_STAGING_IMAGE_SHA256: ${{ secrets.R3II_2025_STAGING_IMAGE_SHA256 }}
  V1_STAGING_IMAGE_SHA256: ${{ secrets.V1_STAGING_IMAGE_SHA256 }}
  V1_STOCK_UPT_URL: ${{ secrets.V1_STOCK_UPT_URL }}
  PLAYER_REPO: Starnished66/compas-player
  PLAYER_V1_BRANCH: tempotec-v1

jobs:
  weekly:
    name: Weekly firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out firmware repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: firmware

      - name: Check out compas-player (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.PLAYER_REPO }}
          ref: main
          path: compas-player

      - name: Check out compas-player (tempotec-v1 branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.PLAYER_REPO }}
          ref: ${{ env.PLAYER_V1_BRANCH }}
          path: compas-player-v1

      - name: Set weekly release identity
        id: release
        run: |
          set -euo pipefail
          day=$(TZ=America/Costa_Rica date +%F)
          {
            echo "tag=weekly-$day"
            echo "title=Weekly Beta $day"
          } >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        run: |
          set -euo pipefail
          for name in STAGING_IMAGE_SHA256 R3PROII_STAGING_IMAGE_SHA256 \
              R3II_2025_STAGING_IMAGE_SHA256 V1_STAGING_IMAGE_SHA256; do
            [[ ${!name:-} =~ ^[0-9a-fA-F]{64}$ ]] || {
              echo "$name secret is missing or invalid." >&2
              exit 1
            }
          done
          [[ ${V1_STOCK_UPT_URL:-} == https://* ]] || {
            echo 'V1_STOCK_UPT_URL secret is missing or not an https URL.' >&2
            exit 1
          }

      - name: Install build and repack tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake curl file genisoimage git patch \
            p7zip-full pkg-config python3 squashfs-tools xz-utils

      - name: Install verified MIPS musl toolchain
        run: |
          set -euo pipefail
          toolchain_dir="$(compas-player/scripts/tools/toolchain/install_mips_toolchain.sh "$RUNNER_TEMP")"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

      - name: Download and verify build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/base inputs/ssc/usr/bin
          # Prepared base images: public compas-player release, checksums in secrets.
          gh release download staging-image-base -R "$PLAYER_REPO" --dir inputs/base \
            --pattern r1.upt --pattern r3proii.upt --pattern r3ii_2025.upt
          echo "$STAGING_IMAGE_SHA256  inputs/base/r1.upt" | sha256sum --check
          echo "$R3PROII_STAGING_IMAGE_SHA256  inputs/base/r3proii.upt" | sha256sum --check
          echo "$R3II_2025_STAGING_IMAGE_SHA256  inputs/base/r3ii_2025.upt" | sha256sum --check
          # Samsung SSC BlueALSA daemon: release asset, checksum tracked in the repository.
          gh release download build-inputs -R "$GITHUB_REPOSITORY" --dir inputs/ssc/usr/bin \
            --pattern bluealsad
          chmod 0755 inputs/ssc/usr/bin/bluealsad
          # Official TempoTec V1 firmware, never committed or republished.
          curl --fail --location --silent --show-error --retry 3 \
            --output inputs/base/v1-stock.upt "$V1_STOCK_UPT_URL"
          echo "$V1_STAGING_IMAGE_SHA256  inputs/base/v1-stock.upt" | sha256sum --check

      - name: Build and package all four images
        env:
          COMPAS_PLAYER_DIR: ${{ github.workspace }}/compas-player
          COMPAS_PLAYER_V1_DIR: ${{ github.workspace }}/compas-player-v1
          BASE_DIR: ${{ github.workspace }}/inputs/base
          V1_STOCK_UPT: ${{ github.workspace }}/inputs/base/v1-stock.upt
          SSC_OVERLAY_DIR: ${{ github.workspace }}/inputs/ssc
          OUT_DIR: ${{ github.workspace }}/release
          RELEASE_LABEL: ${{ steps.release.outputs.title }}
          JOBS: "2"
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          firmware/scripts/build/firmware/build_all_upt.sh

      - name: Prepare release notes
        run: |
          set -euo pipefail
          {
            echo "Automated weekly build of the Compás firmware images. Weekly betas are untested pre-releases."
            echo
            echo "Built from compas-firmware \`${GITHUB_SHA}\`, compas-player \`$(git -C compas-player rev-parse HEAD)\` (r1, r3proii, r3ii_2025) and \`$(git -C compas-player-v1 rev-parse HEAD)\` (tempotec_v1)."
            echo
            echo "### Downloads"
            echo
            echo "- **r1.upt** — complete firmware update; use only on the HiBy R1."
            echo "- **r3proii.upt** — complete firmware update; use only on the HiBy R3 Pro II."
            echo "- **r3ii_2025.upt** — complete firmware update; use only on the HiBy R3II (2025)."
            echo "- **v1.upt** and **v1_md5.txt** — complete firmware update for the TempoTec V1 (early build)."
            echo "- **compas_player**, **compas_player_r3proii**, **compas_player_r3ii_2025** — standalone player updates (copy to **SD/.compas/compas_player**, then choose Settings > Updates > Player Update > Install from SD card)."
            echo
            echo "Checksums are attached in **SHA256SUMS**."
          } > release/RELEASE_NOTES.md

      - name: Publish weekly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          assets=(release/r1.upt release/r3proii.upt release/r3ii_2025.upt release/v1.upt
                  release/v1_md5.txt release/compas_player release/compas_player_r3proii
                  release/compas_player_r3ii_2025 release/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --prerelease --title "$TITLE" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$TAG" "${assets[@]}" --prerelease --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file release/RELEASE_NOTES.md
          fi

      - name: Preserve package as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release.outputs.tag }}
          path: |
            release/*.upt
            release/v1_md5.txt
            release/compas_player*
            release/SHA256SUMS
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
