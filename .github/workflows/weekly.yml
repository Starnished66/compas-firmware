name: Weekly firmware build

on:
  schedule:
    # Every Monday at 13:00 in Costa Rica (UTC-6). GitHub disables scheduled
    # workflows after 60 days without repository activity: see README.
    - cron: "0 19 * * 1"
  workflow_dispatch:

# Read-only by default; only the publish job gets contents: write.
permissions:
  contents: read

concurrency:
  group: weekly-firmware
  cancel-in-progress: false

env:
  PLAYER_REPO: Starnished66/compas-player

jobs:
  build:
    name: Build and validate images
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - name: Check out firmware repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: firmware
          persist-credentials: false

      - name: Check out compas-player (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.PLAYER_REPO }}
          ref: main
          path: compas-player
          persist-credentials: false

      - name: Set weekly release identity
        id: release
        run: |
          set -euo pipefail
          day=$(TZ=America/Costa_Rica date +%F)
          {
            echo "tag=weekly-beta-$day"
            echo "title=Weekly Beta $day"
          } >> "$GITHUB_OUTPUT"

      - name: Install build and repack tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake curl file genisoimage git patch \
            p7zip-full pkg-config python3 squashfs-tools xz-utils

      - name: Install verified MIPS musl toolchain
        run: |
          set -euo pipefail
          toolchain_dir="$(compas-player/scripts/tools/toolchain/install_mips_toolchain.sh "$RUNNER_TEMP")"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

      - name: Download and verify build inputs
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_REPO: ${{ github.repository }}
        run: firmware/scripts/build/firmware/fetch_inputs.sh "$GITHUB_WORKSPACE/inputs"

      - name: Run firmware tests
        env:
          COMPAS_PLAYER_DIR: ${{ github.workspace }}/compas-player
        run: firmware/scripts/tests/run_all.sh

      - name: Build and package all four images
        env:
          COMPAS_PLAYER_DIR: ${{ github.workspace }}/compas-player
          BASE_DIR: ${{ github.workspace }}/inputs/base
          V1_STOCK_UPT: ${{ github.workspace }}/inputs/base/v1-stock.upt
          SSC_OVERLAY_DIR: ${{ github.workspace }}/inputs/ssc
          OUT_DIR: ${{ github.workspace }}/release
          RELEASE_LABEL: ${{ steps.release.outputs.title }}
          JOBS: "2"
          TMPDIR: ${{ runner.temp }}
        run: firmware/scripts/build/firmware/build_all_upt.sh

      - name: Prepare release notes
        run: |
          set -euo pipefail
          fw_sha=$(git -C firmware rev-parse HEAD)
          pl_sha=$(git -C compas-player rev-parse HEAD)
          fw="https://github.com/${GITHUB_REPOSITORY}"
          pl="https://github.com/${PLAYER_REPO}"
          {
            echo "Automated weekly build of the Compás firmware images. Weekly betas are untested pre-releases."
            echo
            echo "Built from compas-firmware [\`${fw_sha}\`](${fw}/commit/${fw_sha}) and compas-player [\`${pl_sha}\`](${pl}/commit/${pl_sha}) (all four boards)."
            echo
            echo "### Downloads"
            echo
            echo "- **r1.upt** — complete firmware update; use only on the HiBy R1."
            echo "- **r3proii.upt** — complete firmware update; use only on the HiBy R3 Pro II."
            echo "- **r3ii_2025.upt** — complete firmware update; use only on the HiBy R3II (2025)."
            echo "- **v1.upt** and **v1_md5.txt** — complete firmware update for the TempoTec V1 (early build)."
            echo "- **compas_player**, **compas_player_r3proii**, **compas_player_r3ii_2025** — standalone player updates (copy to **SD/.compas/compas_player**, then choose Settings > Updates > Player Update > Install from SD card)."
            echo
            echo "Checksums are attached in **SHA256SUMS**."
            echo
            echo "### Source for the GPL components"
            echo
            echo "The images contain GPL/LGPL software (Linux kernel 4.4.94+, vendor and open kernel modules, BlueZ, BlueALSA, D-Bus, GLib, ALSA, dosfstools, exfatprogs, ntfs-3g, Rockbox bootloader). The corresponding source, patches and build recipes are in these repositories:"
            echo
            echo "- Kernel provenance per board, configs, patches and module sources: [firmware/kernel](${fw}/tree/${fw_sha}/firmware/kernel) ([KERNELS.md](${fw}/blob/${fw_sha}/firmware/kernel/KERNELS.md))."
            echo "- Base-system patches and build scripts (BlueZ, BlueALSA, D-Bus, GLib, ALSA, codecs, fsck tools): [scripts/base_image](${fw}/tree/${fw_sha}/scripts/base_image) and [scripts/build](${fw}/tree/${fw_sha}/scripts/build); pinned upstream commits are listed in [scripts/base_image/README.md](${fw}/blob/${fw_sha}/scripts/base_image/README.md)."
            echo "- Player, loader and Rockbox bootloader patch: [compas-player](${pl}/tree/${pl_sha}) (\`firmware/bootloader/rockbox-compas.patch\`)."
            echo "- Stock kernels and modules from HiBy and TempoTec come from their public firmware; for anything else write to the issue tracker of ${fw} and the source will be provided."
          } > release/RELEASE_NOTES.md

      - name: Preserve package for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.release.outputs.tag }}
          path: |
            release/*.upt
            release/v1_md5.txt
            release/compas_player*
            release/SHA256SUMS
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release

      - name: Verify checksums
        run: cd release && sha256sum --check SHA256SUMS

      - name: Publish weekly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          TITLE: ${{ needs.build.outputs.title }}
        run: |
          set -euo pipefail
          # A second run on the same day replaces the release and moves the tag to this commit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" release/*.upt release/v1_md5.txt release/compas_player* \
            release/SHA256SUMS --prerelease --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file release/RELEASE_NOTES.md
